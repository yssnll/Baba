# Tilawa — définition du projet Xcode (généré par XcodeGen)
# Régénérer :  xcodegen generate   puis   open Tilawa.xcodeproj

name: Tilawa

options:
  bundleIdPrefix: app.tilawa
  developmentRegion: fr
  knownRegions:
    - fr
    - en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # XcodeGen produit par défaut le format « xcode16_0 » (objectVersion 77),
  # que les Xcode antérieurs à 16 refusent d'ouvrir. On force un format
  # lisible par Xcode 14, 15 et 16 — indispensable sur les runners macOS
  # dont la version d'Xcode n'est pas garantie.
  projectFormat: xcode14_0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "3.6"
    CURRENT_PROJECT_VERSION: "3"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Le mode « minimal » évite les erreurs de concurrence stricte sur Xcode 16+
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"

targets:
  Tilawa:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Sources/Models
      - path: Sources/Design
      - path: Sources/Services
      - path: Sources/Views
      - path: Sources/Resources
        buildPhase: resources
      - path: Sources/Assets.xcassets
    dependencies:
      - target: TilawaWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Tilawa
        PRODUCT_BUNDLE_IDENTIFIER: app.tilawa.player
        CODE_SIGN_ENTITLEMENTS: Sources/App/Tilawa.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        # La signature est volontairement laissée à Xcode. L'app et
        # l'extension doivent être signées ensemble pour que l'App Group
        # permette au widget de lire l'état du lecteur.
        CODE_SIGN_STYLE: Automatic
    # Le plist est généré hors de « Sources/ » : placé dedans, il serait aussi
    # ramassé par la phase de copie des ressources (Info.plist en double).
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Tilawa
        CFBundleShortVersionString: "3.6"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        # Lecture audio en arrière-plan / écran verrouillé
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        # Autorise les sources personnalisées servies en HTTP simple
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - tilawa

  TilawaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: TilawaWidget
        PRODUCT_BUNDLE_IDENTIFIER: app.tilawa.player.TilawaWidget
        MARKETING_VERSION: "3.6"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/TilawaWidget.entitlements
        INFOPLIST_FILE: Sources/Widget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # Doit utiliser la même équipe et le même App Group que l'app.
        CODE_SIGN_STYLE: Automatic

# Schéma déclaré explicitement : XcodeGen n'en crée pas d'office, et
# « xcodebuild -scheme Tilawa » échouerait sans lui.
schemes:
  Tilawa:
    build:
      targets:
        Tilawa: all
        TilawaWidget: all
    run:
      config: Debug
    archive:
      config: Release
