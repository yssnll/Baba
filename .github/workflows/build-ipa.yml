name: Build IPA

# Compile Tilawa sur un runner macOS et publie une IPA non signée
# en artefact du run. Déclenchable à la main depuis l'onglet Actions.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Environnement
        run: |
          xcodebuild -version
          sw_vers

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: |
          xcodegen generate
          ls -la Tilawa.xcodeproj

      - name: Compiler (non signé)
        run: |
          set -o pipefail
          xcodebuild \
            -project Tilawa.xcodeproj \
            -scheme Tilawa \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Empaqueter l'IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Tilawa.app"
          test -d "$APP" || { echo "::error::Tilawa.app introuvable"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          # Une IPA est simplement un zip contenant un dossier Payload/
          zip -qry Tilawa-unsigned.ipa Payload
          ls -lh Tilawa-unsigned.ipa

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Tilawa-unsigned-ipa
          path: Tilawa-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
